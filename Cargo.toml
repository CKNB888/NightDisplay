[workspace]
resolver = "2"
members = ["crates/nd-core", "crates/nd-win", "crates/nd-cli"]

[workspace.package]
version = "4.0.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
authors = ["传康Kk <CKNB888@users.noreply.github.com>"]
repository = "https://github.com/CKNB888/NightDisplay"
description = "每天定时让本地屏幕变黑、远程照常可用（Windows 10 2004+）"

[workspace.dependencies]
nd-core = { path = "crates/nd-core" }
nd-win = { path = "crates/nd-win" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "local-time", "env-filter"] }
fs4 = "1"
rand = "0.9"
regex = "1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
