name: build-and-test
on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
# 同一分支只留最新一次。新推送会取消还在排队的旧运行。
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'
jobs:
  # 产品只做 Windows。macOS / Linux 没有可用的内置虚拟屏路径，不再构建、不再发版。
  test-windows:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest pillow pystray
      - name: Unit tests
        run: python -m pytest -v tests
      - name: Real UI screenshots (Windows)
        timeout-minutes: 3
        run: python tools/capture_ui.py ui-shots
      - uses: actions/upload-artifact@v4
        with:
          name: ui-shots-${{ matrix.os }}
          path: ui-shots/
      - name: Integration (Windows, incl. VDD driver)
        shell: bash
        timeout-minutes: 12
        run: python tools/ci_integration.py --vdd
      - name: Logs
        if: always()
        shell: bash
        run: cat ci-home/logs/*.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-results-${{ matrix.os }}
          path: |
            ci-results-*.json
            ci-home/logs/
  build-windows:
    needs: test-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller pillow pystray
      - name: Tag matches code version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          python - <<'PY'
          import re, sys
          from pathlib import Path
          sys.path.insert(0, ".")
          from nightdisplay import VERSION
          tag = "${{ github.ref_name }}"[1:]
          assert tag == VERSION, f"tag {tag} != code VERSION {VERSION}"
          iss = Path("packaging/windows.iss").read_text(encoding="utf-8-sig")
          found = re.search(r'#define AppVersion "([^"]+)"', iss)
          assert found and found.group(1) == VERSION, f"installer AppVersion != {VERSION}"
          pyproject = Path("pyproject.toml").read_text(encoding="utf-8")
          assert f'version = "{VERSION}"' in pyproject, f"pyproject version != {VERSION}"
          print(f"tag {tag} == VERSION {VERSION} == installer")
          PY
      - name: Build Windows
        shell: bash
        run: |
          python tools/download_vdd.py --dest vdd && find vdd -type f
          test -n "$(find vdd -iname MttVDD.inf)"
          pyinstaller --onefile --windowed --name NightDisplay --add-data "nightdisplay/resources;nightdisplay/resources" --hidden-import PIL._tkinter_finder --hidden-import PIL._imagingtk --add-data "tools/install_vdd.ps1;tools" --add-data "vdd;vdd" --hidden-import pystray._win32 nightdisplay_main.py
          export NIGHTDISPLAY_HOME=$PWD/smoke
          ./dist/NightDisplay.exe --action status; cat smoke/status.txt || true
          ./dist/NightDisplay.exe --action displays
          ./dist/NightDisplay.exe --action gui --selftest 5; rc=$?; echo "gui rc=$rc"; test $rc -eq 0
          python tools/collect_licenses.py
          # 打包门禁：驱动文件必须齐全，缺一个就失败，不产出“能打开但没虚拟屏”的包。
          test -f nightdisplay/resources/install_vdd.ps1
          test -f nightdisplay/resources/vdd_settings.xml
          test -f nightdisplay/resources/cleanup_old.ps1
          ./dist/NightDisplay.exe --action env
          mkdir out && cp dist/NightDisplay.exe README.md LICENSE NOTICE.md tools/Recover.cmd out/ && cp -r third-party-licenses out/
          cd out && 7z a ../NightDisplay-Windows-x64.zip .
          # 真正产出安装包：Inno Setup 按当前用户安装（PrivilegesRequired=lowest），
          # 驱动安装仍在首次打开时弹一次 UAC，不在安装器里偷偷提权。
          # 注意：上面 cd out 之后当前目录还在 out/ 里，必须先 cd .. 回仓库根，
          # 否则 iscc 找不到 packaging/windows.iss，只报“找不到路径”就退出码 2。
          cd ..
          choco install innosetup --version=6.7.1 -y --no-progress
          iscc packaging/windows.iss
          test -f NightDisplay-Windows-x64-Setup.exe
      - name: Installer cleans old versions (silent upgrade)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 伪造一个旧版本：另一个目录 + 卸载登记 + 正在运行的进程 + 失效 Run 值 + 下载目录旧安装包
          $old = "$env:LOCALAPPDATA\Programs\NightDisplay-3.0.1"
          New-Item -ItemType Directory -Force $old | Out-Null
          Copy-Item C:\Windows\System32\timeout.exe "$old\NightDisplay.exe"
          $k = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\NightDisplayOld_is1'
          New-Item -Force $k | Out-Null
          Set-ItemProperty $k DisplayName 'NightDisplay 3.0.1'
          Set-ItemProperty $k InstallLocation $old
          Set-ItemProperty $k UninstallString "`"$old\missing-unins000.exe`""
          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' 'NightDisplay_old' "`"$old\gone.exe`" --tray"
          $dl = "$env:USERPROFILE\Downloads"; New-Item -ItemType Directory -Force $dl | Out-Null
          Set-Content "$dl\NightDisplay-3.0.1-Setup.exe" 'x'
          $p = Start-Process "$old\NightDisplay.exe" -ArgumentList '/t','600','/nobreak' -PassThru -WindowStyle Hidden
          Start-Sleep 1
          foreach ($round in 1..2) {
            $i = Start-Process .\NightDisplay-Windows-x64-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=setup.log' -PassThru -Wait
            Get-Content setup.log | Select-String 'cleanup|Exit code' | Out-Host
            if ($i.ExitCode -ne 0) { throw "setup exit $($i.ExitCode)" }
            if (-not (Test-Path "$env:LOCALAPPDATA\Programs\NightDisplay\NightDisplay.exe")) { throw 'not installed' }
          }
          if (Get-Process -Id $p.Id -ErrorAction SilentlyContinue) { throw 'old process alive' }
          if (Test-Path $old) { throw 'old dir left' }
          if (Test-Path $k) { throw 'old uninstall key left' }
          if ((Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run').NightDisplay_old) { throw 'stale Run left' }
          if (Test-Path "$dl\NightDisplay-3.0.1-Setup.exe") { throw 'old setup left' }
          $n = @(Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -like 'NightDisplay*' }).Count
          if ($n -ne 1) { throw "uninstall entries = $n" }
          Get-Process NightDisplay -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Output 'cleanup OK'
      - uses: actions/upload-artifact@v4
        with:
          name: NightDisplay-Windows-x64
          path: NightDisplay-Windows-x64.zip
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: NightDisplay-Windows-x64-Setup
          path: NightDisplay-Windows-x64-Setup.exe
  qa-windows:
    needs: build-windows
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: NightDisplay-Windows-x64
      - name: Unpack built package
        shell: bash
        run: mkdir pkg && cd pkg && 7z x ../NightDisplay-Windows-x64.zip && ls -la
      - name: End-to-end QA, 3 rounds on the packaged exe
        run: python tools/qa_windows.py pkg\NightDisplay.exe 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-${{ matrix.os }}
          path: |
            qa-windows.json
            qa-evidence/
  release:
    needs: [build-windows, qa-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: NightDisplay-Windows-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.exe
